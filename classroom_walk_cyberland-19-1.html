<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Classroom Walk</title>
<style>
html, body {
  margin: 0; padding: 0; background: #1b1b1b;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  width: 100%; height: 100%;
  color: #eee;
}
#wrap { padding: 0; width: 100%; max-width: 100%; box-sizing: border-box; }
h2 { display: none; margin: 4px 0 10px; font-size: 17px; text-align: center; color: #f2f2f2; }
#stage {
  position: relative; width: 100vw; height: 100vh;
  border-radius: 0; overflow: hidden; box-shadow: none;
  border: none; touch-action: none; background: #000;
}
canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; image-rendering: pixelated; }
#controls {
  display: none; justify-content: space-between; align-items: center;
  margin-top: 10px; font-size: 13px; color: #aaa; gap: 8px; flex-wrap: wrap;
}
button {
  background: #2c6e49; color: white; border: none; border-radius: 6px;
  padding: 8px 12px; font-size: 13px; cursor: pointer;
}
button:active { background: #1f5236; }
#dpad {
  display: grid; grid-template-columns: 46px 46px 46px; grid-template-rows: 46px 46px 46px;
  gap: 4px; margin-top: 10px; justify-content: center;
}
#dpad button { width: 46px; height: 46px; font-size: 18px; padding: 0; }
.spacer { visibility: hidden; }
#charSelectControls {
  display: none; justify-content: center; gap: 10px; margin-top: 10px;
}
#charSelectControls button {
  padding: 10px 16px; font-size: 14px; border-radius: 8px; border: none;
  background: #2f5d8f; color: #fff; cursor: pointer;
}
#charSelectControls button:active { background: #1f4066; }
#csConfirmBtn { background: #3f9142; }
#csConfirmBtn:active { background: #2c6b2e; }
#hint { font-size: 12px; color: #888; text-align: center; margin-top: 6px; }
#boardPrompt, #actionPrompt {
  position: absolute; left: 50%; top: 14%; transform: translate(-50%, 0);
  background: rgba(20,20,20,0.82); color: #fff; padding: 6px 12px;
  border-radius: 20px; font-size: 12.5px; display: none; pointer-events: none;
  white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.4); z-index: 5;
}
#speechBubble {
  position: absolute; left: 50%; top: 8%; transform: translate(-50%, 0);
  background: #fdfdf6; color: #222; padding: 10px 14px; border-radius: 12px;
  font-size: 12.5px; display: none; pointer-events: none; max-width: 80%;
  box-shadow: 0 4px 14px rgba(0,0,0,0.5); z-index: 6; text-align: center;
}
#writeBtn, #talkBtn {
  position: absolute; right: 10px; bottom: 10px; display: none;
  background: #b5482a; padding: 9px 14px; border-radius: 20px; font-size: 13px; z-index: 5;
}
#writeBtn:active, #talkBtn:active { background: #8f381f; }
#talkBtn { background: #7b2fbf; }
#talkBtn:active { background: #5d2291; }
#boardModal {
  position: absolute; inset: 0; background: rgba(0,0,0,0.55);
  display: none; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
}
#boardModal.open { display: flex; }
#boardModalCard {
  background: #fdfdf6; color: #222; border-radius: 10px; padding: 16px;
  width: 100%; max-width: 340px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
#boardModalCard h3 { margin: 0 0 8px; font-size: 15px; color: #333; }
#boardModalCard input {
  width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 14px;
  border: 1px solid #bbb; border-radius: 6px; margin-bottom: 10px;
}
#boardModalCard .row { display: flex; gap: 8px; justify-content: flex-end; }
#boardModalCard button.cancel { background: #999; }
#boardModalCard button.cancel:active { background: #777; }
#laptopBtn {
  position: absolute; right: 10px; bottom: 10px; display: none;
  background: #1f7a8c; padding: 9px 14px; border-radius: 20px; font-size: 13px; z-index: 5;
}
#laptopBtn:active { background: #145a66; }
#videoModal {
  position: absolute; inset: 0; background: rgba(0,0,0,0.7);
  display: none; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
  z-index: 20;
}
#videoModal.open { display: flex; }
#videoModalCard {
  background: #111; border-radius: 10px; padding: 12px;
  width: 90%; height: 90%; max-width: 90vw; max-height: 90vh; box-sizing: border-box;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}
#videoModalCard h3 { margin: 0 0 8px; font-size: 14px; color: #eee; text-align: center; }
#videoFrameWrap {
  position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; overflow: hidden;
}
#videoFrameWrap iframe, #videoFrameWrap > div { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
#videoModalCard .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
#videoModalCard button.cancel { background: #999; }
#videoModalCard button.cancel:active { background: #777; }
#dialogueOverlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.75);
  display: none; align-items: center; justify-content: center;
  border-radius: 6px; z-index: 25; padding: 10px; box-sizing: border-box;
}
#dialogueOverlay.open { display: flex; }
#dialogueOverlay img {
  max-width: 100%; max-height: 100%; border-radius: 6px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.6);
}
#dialogueSkipBtn {
  position: absolute; right: 8px; bottom: 8px; z-index: 26; display: none;
  background: #555; padding: 6px 10px; font-size: 11px; border-radius: 14px;
}
#dialogueSkipBtn:active { background: #3a3a3a; }
</style>

<body>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const bgCanvas = document.getElementById('bg');
const fgCanvas = document.getElementById('fg');
const bgCtx = bgCanvas.getContext('2d');
const fgCtx = fgCanvas.getContext('2d');
bgCtx.imageSmoothingEnabled = false;
fgCtx.imageSmoothingEnabled = false;
const W = 1200, H = 675;

// ---- Background images (one per scene) ----
const roomImg = new Image();
roomImg.src = "assets/images/backgrounds/o1aroom.png";
const cyberImg = new Image();
cyberImg.src = "assets/images/backgrounds/cyberland.png.png";

// ---- Character sprites (4 real uploaded directions) ----
const charImgs = {
  down: new Image(),  // front view
  up: new Image(),    // back view
  left:  new Image(),  // profile facing left
  right: new Image()   // profile facing right
};
charImgs.down.src  = "assets/images/players/front_sprite.png";
charImgs.up.src    = "assets/images/players/back_sprite.png";
charImgs.left.src  = "assets/images/players/side_sprite.png";
charImgs.right.src = "assets/images/players/side_sprite_transparent_exact.png";

// For each direction, the actual visible-character bounding box within its source image
// (in source-image pixel coordinates), so sprites with different amounts of empty canvas
// margin still render at a consistent on-screen size. Computed once per image on load.
const charContentBox = { down: null, up: null, left: null, right: null };

function computeContentBox(img) {
  const cw = img.naturalWidth, ch = img.naturalHeight;
  if (!cw || !ch) return { x: 0, y: 0, w: cw, h: ch };
  const off = document.createElement('canvas');
  off.width = cw; off.height = ch;
  const octx = off.getContext('2d');
  octx.drawImage(img, 0, 0);
  let data;
  try {
    data = octx.getImageData(0, 0, cw, ch).data;
  } catch (e) {
    // Canvas got tainted (e.g. file:// CORS) — fall back to full image, no crash.
    return { x: 0, y: 0, w: cw, h: ch };
  }
  let minX = cw, minY = ch, maxX = -1, maxY = -1;
  for (let y = 0; y < ch; y++) {
    for (let x = 0; x < cw; x++) {
      const i = (y * cw + x) * 4;
      const a = data[i+3];
      if (a < 10) continue; // transparent
      const r = data[i], g = data[i+1], b = data[i+2];
      if (r > 245 && g > 245 && b > 245) continue; // near-white background
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    }
  }
  if (maxX < 0) return { x: 0, y: 0, w: cw, h: ch }; // nothing found, fall back to full image
  return { x: minX, y: minY, w: (maxX - minX + 1), h: (maxY - minY + 1) };
}

function refreshContentBox(key) {
  charContentBox[key] = computeContentBox(charImgs[key]);
}

let charsLoaded = 0, roomLoaded = false, cyberLoaded = false;
const NUM_CHAR_IMAGES = 4;

const startupImg = new Image();
startupImg.src = "assets/images/startup/start.png";
let startupLoaded = false;
startupImg.onload = () => { startupLoaded = true; tryStart(); };

const NUM_CHARSELECT_IMAGES = 5;
let charSelectLoaded = 0;
const charSelectImgs = [];
for (let i = 0; i < NUM_CHARSELECT_IMAGES; i++) {
  const cImg = new Image();
  cImg.src = `assets/images/charselect/char${i}.png`;
  cImg.onload = () => { charSelectLoaded++; tryStart(); };
  charSelectImgs.push(cImg);
}

let gameState = 'menu';  // 'menu' | 'fade' | 'charselect' | 'game'
let gameStartTime = 0;   // for star flicker timing
let selectedCharIndex = 0;   // 0 = placeholder/default, 1-4 = real characters
let confirmedCharIndex = null;
let fadeStartTime = 0;
const FADE_DURATION = 500; // ms, half out / half in
let fadeNextState = 'charselect';

// ================= CLASSROOM SCENE =================
const chairColsX = [187, 290, 393, 496, 599, 702, 805, 908, 1011];
const chairRowsY = [363, 441, 519, 598];
const CHAIR_W = 60, CHAIR_H = 16;

let classroomHitboxes = [];
for (const ry of chairRowsY) {
  for (const cx of chairColsX) {
    classroomHitboxes.push({ x: cx - CHAIR_W/2, y: ry - CHAIR_H/2, w: CHAIR_W, h: CHAIR_H, type: 'chair' });
  }
}
classroomHitboxes.push({ x: 171, y: 292, w: 153, h: 74, type: 'desk' });
classroomHitboxes.push({ x: 800, y: 284, w: 32, h: 42, type: 'obj' });
classroomHitboxes.push({ x: 0, y: 0, w: W, h: 182, type: 'wall' });
classroomHitboxes.push({ x: 375, y: 182, w: 485, h: 100, type: 'board' });
classroomHitboxes.push({ x: 0, y: 0, w: 60, h: H, type: 'wall' });
classroomHitboxes.push({ x: W-60, y: 0, w: 60, h: H, type: 'wall' });
classroomHitboxes.push({ x: 0, y: H-20, w: W, h: 20, type: 'wall' });
classroomHitboxes.push({ x: 1050, y: 105, w: 95, h: 215, type: 'door' });

const npc = { x: 535, y: 583, w: 30, h: 44, type: 'npc' };
const npcTalkZone = { x: 497, y: 539, w: 106, h: 132 };
const portal = { x: 517, y: 559, w: 66, h: 92 };

const boardZone = { x: 380, y: 284, w: 460, h: 50 };
const BOARD_TEXT_X = 410, BOARD_TEXT_Y = 118, BOARD_LINE_H = 27, MAX_BOARD_LINES = 5;
const boardColors = ['#c0392b', '#1a3fa0', '#1b5e20', '#222222'];
let boardMessages = [];
let nearBoard = false;
let nearNpc = false;

// ================= CYBER LAND SCENE =================
const backPortal = { x: 577, y: 604, w: 48, h: 36 };

// Master computer (hologram laptop) — sits just above the back portal, on its pedestal
const laptop = { x: 560, y: 470, w: 80, h: 60 };
const laptopHitbox = { x: 555, y: 495, w: 90, h: 40, type: 'laptop' };
const laptopZone = { x: 520, y: 500, w: 160, h: 110 };
const YOUTUBE_VIDEO_ID = '04Z_6C2wpCQ';
let nearLaptop = false;

let cyberlandHitboxes = [
  { x: 0, y: 0, w: W, h: 18, type: 'wall' },
  { x: 0, y: H-18, w: W, h: 18, type: 'wall' },
  { x: 0, y: 0, w: 18, h: H, type: 'wall' },
  { x: W-18, y: 0, w: 18, h: H, type: 'wall' },
  { x: 244.5, y: 500.3, w: 157.5, h: 68.4, type: 'tree' },
  { x: 798.2, y: 500.3, w: 157.5, h: 68.4, type: 'tree' },
  { x: 247.0, y: 230.0, w: 153.3, h: 71.4, type: 'tree' },
  { x: 799.7, y: 230.0, w: 153.3, h: 71.4, type: 'tree' },
  { x: 505.5, y: 581.2, w: 21.1, h: 93.8, type: 'wall' },
  { x: 654.7, y: 581.2, w: 20.9, h: 93.8, type: 'wall' },
  { x: 460.4, y: 605.3, w: 20, h: 15, type: 'post' },
  { x: 684.2, y: 605.3, w: 20, h: 15, type: 'post' },
  laptopHitbox,
];

const cyberlandOccluders = [
  { srcX: 310, srcY: 705, srcW: 160, srcH: 110, dstX: 256.9, dstY: 438.2, dstW: 132.6, dstH: 68.3, anchorY: 568.7 },
  { srcX: 978, srcY: 705, srcW: 160, srcH: 110, dstX: 810.5, dstY: 438.2, dstW: 132.6, dstH: 68.3, anchorY: 568.7 },
  { srcX: 308, srcY: 275, srcW: 165, srcH: 110, dstX: 255.2, dstY: 170.9, dstW: 136.7, dstH: 68.4, anchorY: 301.4 },
  { srcX: 975, srcY: 275, srcW: 165, srcH: 110, dstX: 808.0, dstY: 170.9, dstW: 136.7, dstH: 68.4, anchorY: 301.4 },
  { srcX: 545, srcY: 915, srcW: 45,  srcH: 75,  dstX: 451.8, dstY: 568.7, dstW: 37.3,  dstH: 46.6, anchorY: 615.3 },
  { srcX: 815, srcY: 915, srcW: 45,  srcH: 75,  dstX: 675.6, dstY: 568.7, dstW: 37.3,  dstH: 46.6, anchorY: 615.3 },
];

// ================= SHARED STATE =================
let scene = 'classroom';
let npcTalked = false;
let teleportCooldown = 0;
let showHit = false;
let speechTimer = 0;
const speechBubbleEl = document.getElementById('speechBubble');

function currentHitboxes() {
  if (scene === 'classroom') return npcTalked ? classroomHitboxes : classroomHitboxes.concat([npc]);
  return cyberlandHitboxes;
}

function showSpeech(text, ms) {
  speechBubbleEl.textContent = text;
  speechBubbleEl.style.display = 'block';
  speechTimer = ms || 2600;
}

const player = {
  x: 1085, y: 325,
  w: 26, h: 14,
  spriteH: 150,
  speed: 2.6,
  facing: 'left',
  moving: false,
  animT: 0
};

const CYBER_SPRITE_SCALE = 0.35;
const CYBER_CAMERA_ZOOM = 3.9;
const CYBER_SPEED = 1.3;

let cameraZoom = 1, cameraLeft = 0, cameraTop = 0;
function updateCamera() {
  cameraZoom = (scene === 'cyberland') ? CYBER_CAMERA_ZOOM : 1;
  const viewW = W / cameraZoom;
  const viewH = H / cameraZoom;
  let left = (player.x + player.w / 2) - viewW / 2;
  let top = (player.y + player.h / 2) - viewH / 2;
  left = Math.max(0, Math.min(W - viewW, left));
  top = Math.max(0, Math.min(H - viewH, top));
  cameraLeft = left;
  cameraTop = top;
}
function applyCameraTransform(ctx) {
  ctx.setTransform(cameraZoom, 0, 0, cameraZoom, -cameraLeft * cameraZoom, -cameraTop * cameraZoom);
}
function resetTransform(ctx) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

function updateUIVisibility() {
  const gameplayDisplay = (gameState === 'game') ? '' : 'none';
  document.getElementById('dpad').style.display = (gameState === 'game') ? 'grid' : 'none';
  document.getElementById('hint').style.display = gameplayDisplay;
  document.getElementById('controls').style.display = gameplayDisplay;
  document.getElementById('charSelectControls').style.display = (gameState === 'charselect') ? 'flex' : 'none';
  if (gameState !== 'game') {
    writeBtn.style.display = 'none';
    talkBtn.style.display = 'none';
  }
}

function startFade(next) {
  gameState = 'fade';
  fadeStartTime = Date.now();
  fadeNextState = next;
  updateUIVisibility();
}

function applyCharacterSprites(charIndex) {
  // P2 (default) keeps the original hardcoded sprites — no changes, resolves immediately.
  let newSrcs = null;
  if (charIndex === 1) {
    newSrcs = {
      down:  "assets/images/players/thea/theaf.png",
      up:    "assets/images/players/thea/theab.png",
      left:  "assets/images/players/thea/theal.png",
      right: "assets/images/players/thea/thear.png"
    };
  } else if (charIndex === 3) {
    newSrcs = {
      down:  "assets/images/players/vea/veaf.png",
      up:    "assets/images/players/vea/veaba.png",
      left:  "assets/images/players/vea/veale.png",
      right: "assets/images/players/vea/veari.png"
    };
  } else if (charIndex === 4) {
    newSrcs = {
      down:  "assets/images/players/venice/heidenf.png",
      up:    "assets/images/players/venice/heidenb.png",
      left:  "assets/images/players/venice/heidenl.png",
      right: "assets/images/players/venice/heidenr.png"
    };
  }

  if (!newSrcs) return Promise.resolve(); // P2 (default): nothing to load

  const loadPromises = Object.keys(newSrcs).map(key => {
    return new Promise(resolve => {
      const img = charImgs[key];
      img.onload = () => { refreshContentBox(key); resolve(); };
      img.onerror = resolve; // don't hang forever if a file is missing/misnamed
      img.src = newSrcs[key];
    });
  });
  return Promise.all(loadPromises);
}

function csNext() { selectedCharIndex = Math.min(NUM_CHARSELECT_IMAGES - 1, selectedCharIndex + 1); }
function csPrev() { selectedCharIndex = Math.max(0, selectedCharIndex - 1); }
function csConfirm() {
  if (selectedCharIndex < 1) return;
  confirmedCharIndex = selectedCharIndex;
  csConfirmBtn.disabled = true;
  applyCharacterSprites(selectedCharIndex).then(() => {
    gameState = 'game';
    scene = 'classroom';
    updateUIVisibility();
    csConfirmBtn.disabled = false;
  });
}

document.getElementById('csPrevBtn').addEventListener('click', csPrev);
document.getElementById('csNextBtn').addEventListener('click', csNext);
const csConfirmBtn = document.getElementById('csConfirmBtn');
csConfirmBtn.addEventListener('click', csConfirm);

const stageEl = document.getElementById('stage');
stageEl.addEventListener('click', () => {
  if (gameState === 'menu') startFade('charselect');
});

const keys = {};
window.addEventListener('keydown', e => {
  if (gameState === 'menu') {
    startFade('charselect');
    return;
  }
  if (gameState === 'charselect') {
    const k = e.key.toLowerCase();
    if (k === 'arrowright') csNext();
    else if (k === 'arrowleft') csPrev();
    else if (k === ' ') csConfirm();
    e.preventDefault();
    return;
  }
  if (document.activeElement === boardInput) return;
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if (k === 'e') {
    if (nearBoard && !modalOpen && scene === 'classroom') openBoardModal();
    else if (nearNpc && scene === 'classroom' && !npcTalked) talkToNpc();
    else if (nearLaptop && scene === 'cyberland' && !videoModalOpen) openVideoModal();
  }
  if (k === 'escape') {
    if (modalOpen) closeBoardModal();
    if (videoModalOpen) closeVideoModal();
  }
});
window.addEventListener('keyup', e => {
  if (document.activeElement === boardInput) return;
  keys[e.key.toLowerCase()] = false;
});

function heldDir() {
  if (modalOpen || videoModalOpen) return { dx: 0, dy: 0 };
  let dx = 0, dy = 0;
  if (keys['arrowup'] || keys['w']) dy -= 1;
  if (keys['arrowdown'] || keys['s']) dy += 1;
  if (keys['arrowleft'] || keys['a']) dx -= 1;
  if (keys['arrowright'] || keys['d']) dx += 1;
  return { dx, dy };
}

const padState = {};
function bindHold(id, dx, dy) {
  const el = document.getElementById(id);
  const start = (e) => { padState[id] = {dx, dy}; e.preventDefault(); };
  const end = (e) => { delete padState[id]; e.preventDefault(); };
  el.addEventListener('mousedown', start);
  el.addEventListener('touchstart', start, {passive:false});
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', end);
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', end);
}
bindHold('btnUp', 0, -1);
bindHold('btnDown', 0, 1);
bindHold('btnLeft', -1, 0);
bindHold('btnRight', 1, 0);

document.getElementById('toggleHit').addEventListener('click', () => {
  showHit = !showHit;
  document.getElementById('toggleHit').textContent = showHit ? 'Hide hitboxes' : 'Show hitboxes';
});

const boardPromptEl = document.getElementById('boardPrompt');
const actionPromptEl = document.getElementById('actionPrompt');
const writeBtn = document.getElementById('writeBtn');
const talkBtn = document.getElementById('talkBtn');
const boardModal = document.getElementById('boardModal');
const boardInput = document.getElementById('boardInput');
let modalOpen = false;

const laptopBtn = document.getElementById('laptopBtn');
const videoModal = document.getElementById('videoModal');
const videoCloseBtn = document.getElementById('videoCloseBtn');
const dialogueOverlay = document.getElementById('dialogueOverlay');
const dialogueImg = document.getElementById('dialogueImg');
const dialogueSkipBtn = document.getElementById('dialogueSkipBtn');
let videoModalOpen = false;

// Each segment: video pauses once currentTime reaches `pauseAt` (seconds),
// shows `img` for `holdMs`, then resumes playback.
const dialogueSegments = [
  { pauseAt: 20, img: 'assets/images/dialogue/Q1.png', holdMs: 3000 },
];
let nextSegmentIndex = 0;
let dialogueActive = false;
let dialogueTimeoutId = null;
let watchIntervalId = null;

let ytPlayer = null;
let ytApiReady = false;
function onYouTubeIframeAPIReady() { ytApiReady = true; }

function startSegmentWatcher() {
  stopSegmentWatcher();
  watchIntervalId = setInterval(() => {
    if (!ytPlayer || dialogueActive) return;
    if (nextSegmentIndex >= dialogueSegments.length) return;
    const seg = dialogueSegments[nextSegmentIndex];
    if (typeof ytPlayer.getCurrentTime !== 'function') return;
    if (ytPlayer.getCurrentTime() >= seg.pauseAt) {
      showDialogueImage(seg);
    }
  }, 200);
}
function stopSegmentWatcher() {
  if (watchIntervalId) { clearInterval(watchIntervalId); watchIntervalId = null; }
}

function showDialogueImage(seg) {
  dialogueActive = true;
  ytPlayer.pauseVideo();
  dialogueImg.src = seg.img;
  dialogueOverlay.classList.add('open');
  dialogueSkipBtn.style.display = 'block';
  dialogueTimeoutId = setTimeout(advanceDialogue, seg.holdMs);
}
function advanceDialogue() {
  if (!dialogueActive) return;
  if (dialogueTimeoutId) { clearTimeout(dialogueTimeoutId); dialogueTimeoutId = null; }
  dialogueActive = false;
  dialogueOverlay.classList.remove('open');
  dialogueSkipBtn.style.display = 'none';
  nextSegmentIndex++;
  if (ytPlayer && videoModalOpen) ytPlayer.playVideo();
}
dialogueSkipBtn.addEventListener('click', advanceDialogue);

function openVideoModal() {
  videoModalOpen = true;
  videoModal.classList.add('open');
  laptopBtn.style.display = 'none';
  nextSegmentIndex = 0;
  dialogueActive = false;
  dialogueOverlay.classList.remove('open');
  dialogueSkipBtn.style.display = 'none';

  const create = () => {
    if (ytPlayer) {
      ytPlayer.seekTo(0);
      ytPlayer.playVideo();
      startSegmentWatcher();
      return;
    }
    ytPlayer = new YT.Player('videoFrame', {
      videoId: YOUTUBE_VIDEO_ID,
      playerVars: { autoplay: 1, rel: 0 },
      events: {
        onReady: (e) => { e.target.playVideo(); startSegmentWatcher(); }
      }
    });
  };

  if (ytApiReady) create();
  else {
    const prevCb = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { ytApiReady = true; if (prevCb) prevCb(); create(); };
  }
}
function closeVideoModal() {
  videoModalOpen = false;
  videoModal.classList.remove('open');
  stopSegmentWatcher();
  if (dialogueTimeoutId) { clearTimeout(dialogueTimeoutId); dialogueTimeoutId = null; }
  dialogueActive = false;
  dialogueOverlay.classList.remove('open');
  dialogueSkipBtn.style.display = 'none';
  if (ytPlayer && typeof ytPlayer.stopVideo === 'function') ytPlayer.stopVideo();
}
laptopBtn.addEventListener('click', () => { if (nearLaptop && !videoModalOpen) openVideoModal(); });
videoCloseBtn.addEventListener('click', closeVideoModal);

function openBoardModal() {
  modalOpen = true;
  boardModal.classList.add('open');
  player.moving = false;
  player.facing = 'up';
  boardInput.value = '';
  setTimeout(() => boardInput.focus(), 30);
}
function closeBoardModal() {
  modalOpen = false;
  boardModal.classList.remove('open');
}
function submitBoardMessage() {
  const text = boardInput.value.trim();
  if (text) {
    const color = boardColors[Math.floor(Math.random() * boardColors.length)];
    boardMessages.push({ text: text.slice(0, 28), color });
    if (boardMessages.length > MAX_BOARD_LINES) boardMessages.shift();
  }
  closeBoardModal();
}
writeBtn.addEventListener('click', () => { if (nearBoard && !modalOpen) openBoardModal(); });
document.getElementById('boardSubmit').addEventListener('click', submitBoardMessage);
document.getElementById('boardCancel').addEventListener('click', closeBoardModal);
boardInput.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter') submitBoardMessage();
  if (e.key === 'Escape') closeBoardModal();
});

function talkToNpc() {
  npcTalked = true;
  showSpeech("Guide: \"That portal behind me leads to Cyber Land. Step into it whenever you're ready.\"", 3200);
}
talkBtn.addEventListener('click', () => { if (nearNpc && scene === 'classroom') talkToNpc(); });

function drawMenu() {
  resetTransform(bgCtx);
  bgCtx.clearRect(0, 0, W, H);
  bgCtx.drawImage(startupImg, 0, 0, W, H);

  const elapsed = Date.now() - gameStartTime;

  bgCtx.fillStyle = 'rgba(0,0,0,0.3)';
  const starPatternCycle = Math.floor(elapsed / 100) % 8;
  for (let y = 0; y < H; y += 30) {
    for (let x = 0; x < W; x += 30) {
      if (Math.random() > 0.6 || (starPatternCycle & (1 << ((x + y) % 8))) === 0) {
        bgCtx.fillRect(x + 5, y + 5, 2, 2);
      }
    }
  }

  const textAlpha = 0.5 + 0.5 * Math.sin(elapsed / 500);
  bgCtx.fillStyle = `rgba(255,255,255,${textAlpha})`;
  bgCtx.font = 'bold 18px monospace';
  bgCtx.textAlign = 'center';
  bgCtx.fillText('PRESS ANY KEY OR TAP TO START', W/2, H - 40);
}

function drawCharSelect() {
  resetTransform(bgCtx);
  bgCtx.clearRect(0, 0, W, H);
  bgCtx.fillStyle = '#0a0a12';
  bgCtx.fillRect(0, 0, W, H);

  const img = charSelectImgs[selectedCharIndex];
  const scale = Math.min(W / img.naturalWidth, (H * 0.8) / img.naturalHeight);
  const dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
  const dx = (W - dw) / 2, dy = (H - dh) / 2 - 20;
  bgCtx.drawImage(img, dx, dy, dw, dh);

  bgCtx.textAlign = 'center';
  bgCtx.fillStyle = '#fff';
  bgCtx.font = 'bold 22px monospace';
  bgCtx.fillText(
    selectedCharIndex === 0 ? 'USE ARROW KEYS TO CHOOSE A CHARACTER' : `CHARACTER ${selectedCharIndex}`,
    W / 2, H - 50
  );
  if (selectedCharIndex >= 1) {
    bgCtx.font = '16px monospace';
    bgCtx.fillStyle = 'rgba(255,255,255,0.8)';
    bgCtx.fillText('PRESS SPACE TO CONFIRM', W / 2, H - 22);
  }

  bgCtx.font = 'bold 28px monospace';
  bgCtx.fillStyle = selectedCharIndex > 0 ? '#fff' : 'rgba(255,255,255,0.25)';
  bgCtx.fillText('<', 40, H / 2);
  bgCtx.fillStyle = selectedCharIndex < NUM_CHARSELECT_IMAGES - 1 ? '#fff' : 'rgba(255,255,255,0.25)';
  bgCtx.fillText('>', W - 40, H / 2);
}

function drawFadeTransition() {
  const elapsed = Date.now() - fadeStartTime;
  const half = FADE_DURATION / 2;
  if (elapsed < half) {
    drawMenu();
    bgCtx.fillStyle = `rgba(0,0,0,${elapsed / half})`;
    bgCtx.fillRect(0, 0, W, H);
  } else if (elapsed < FADE_DURATION) {
    if (fadeNextState === 'charselect') drawCharSelect();
    bgCtx.fillStyle = `rgba(0,0,0,${1 - (elapsed - half) / half})`;
    bgCtx.fillRect(0, 0, W, H);
  } else {
    gameState = fadeNextState;
    updateUIVisibility();
  }
}

function drawBackground() {
  resetTransform(bgCtx);
  bgCtx.clearRect(0, 0, W, H);
  applyCameraTransform(bgCtx);
  if (scene === 'classroom' && roomLoaded) bgCtx.drawImage(roomImg, 0, 0, W, H);
  else if (scene === 'cyberland' && cyberLoaded) bgCtx.drawImage(cyberImg, 0, 0, W, H);

  document.getElementById('sceneTitle').textContent =
    scene === 'classroom' ? 'Room 01AB — walk around' : 'Cyber Land';
  document.getElementById('hint').textContent =
    scene === 'classroom'
      ? 'Arrow keys / WASD to move. Talk to the guide near the portal, then walk into the portal to teleport to Cyber Land.'
      : 'Arrow keys / WASD to move. Walk into the glowing portal near the middle to return to the classroom.';
}

function teleportTo(newScene, spawnX, spawnY) {
  scene = newScene;
  player.x = spawnX; player.y = spawnY;
  player.moving = false;
  teleportCooldown = 30;
  drawBackground();
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function tryMove(dx, dy) {
  player.moving = (dx !== 0 || dy !== 0);
  if (!player.moving) return;
  const len = Math.hypot(dx, dy) || 1;
  const spd = (scene === 'cyberland') ? CYBER_SPEED : player.speed;
  const mvx = (dx/len) * spd;
  const mvy = (dy/len) * spd;

  const hb = currentHitboxes();

  let nx = player.x + mvx;
  const boxX = { x: nx, y: player.y, w: player.w, h: player.h };
  if (!hb.some(box => rectsOverlap(boxX, box))) player.x = nx;

  let ny = player.y + mvy;
  const boxY = { x: player.x, y: ny, w: player.w, h: player.h };
  if (!hb.some(box => rectsOverlap(boxY, box))) player.y = ny;

  if (dx > 0) player.facing = 'right';
  else if (dx < 0) player.facing = 'left';
  else if (dy > 0) player.facing = 'down';
  else if (dy < 0) player.facing = 'up';
}

const HIP_FRAC = { down: 0.58, up: 0.57, left: 0.55, right: 0.55 };

function drawPlayer(ctx) {
  const img = charImgs[player.facing];
  const hipFrac = HIP_FRAC[player.facing];

  const cx = player.x + player.w/2;
  const feetY = player.y + player.h;

  const spriteH = player.spriteH * (scene === 'cyberland' ? CYBER_SPRITE_SCALE : 1);

  // Use the actual visible-character bounding box (not the full padded canvas) so
  // sprites with different amounts of empty margin still render at a consistent size.
  const box = charContentBox[player.facing] || { x: 0, y: 0, w: img.naturalWidth, h: img.naturalHeight };
  const BX = box.x, BY = box.y, BW = box.w, BH = box.h;
  const spriteW = spriteH * (BW / BH);

  const hipSrcY = BY + BH * hipFrac;      // absolute source-image Y of the hip split line
  const legSrcH = (BY + BH) - hipSrcY;    // height of the leg region in source pixels

  let swing = 0, bob = 0;
  if (player.moving) {
    player.animT += 0.22;
    swing = Math.sin(player.animT);
    bob = Math.abs(Math.sin(player.animT)) * 2.5;
  } else {
    player.animT = 0;
  }

  const top = feetY - spriteH - bob;
  const left = cx - spriteW/2;
  const hipDestY = top + spriteH * hipFrac;
  const legDestH = spriteH - spriteH * hipFrac;

  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.beginPath();
  ctx.ellipse(cx, feetY, spriteW * 0.30, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.drawImage(img, BX, BY, BW, BH * hipFrac, left, top, spriteW, spriteH * hipFrac);

  if (player.facing === 'down' || player.facing === 'up') {
    const maxSwingAngle = 0.34;
    ctx.save();
    ctx.translate(cx, hipDestY);
    ctx.rotate(swing * maxSwingAngle);
    ctx.drawImage(img, BX, hipSrcY, BW/2, legSrcH, -spriteW/2, 0, spriteW/2, legDestH);
    ctx.restore();

    ctx.save();
    ctx.translate(cx, hipDestY);
    ctx.rotate(-swing * maxSwingAngle);
    ctx.drawImage(img, BX + BW/2, hipSrcY, BW/2, legSrcH, 0, 0, spriteW/2, legDestH);
    ctx.restore();
  } else {
    // Left/right: same leg swing animation
    const maxSwingAngle = 0.34;
    ctx.save();
    ctx.translate(cx, hipDestY);
    ctx.rotate(swing * maxSwingAngle);
    ctx.drawImage(img, BX, hipSrcY, BW/2, legSrcH, -spriteW/2, 0, spriteW/2, legDestH);
    ctx.restore();

    ctx.save();
    ctx.translate(cx, hipDestY);
    ctx.rotate(-swing * maxSwingAngle);
    ctx.drawImage(img, BX + BW/2, hipSrcY, BW/2, legSrcH, 0, 0, spriteW/2, legDestH);
    ctx.restore();
  }
}

function drawBoardMessages(ctx) {
  if (!boardMessages.length) return;
  ctx.save();
  ctx.font = "17px 'Comic Sans MS', 'Segoe Print', cursive";
  ctx.textBaseline = 'alphabetic';
  boardMessages.forEach((m, i) => {
    ctx.save();
    const x = BOARD_TEXT_X, y = BOARD_TEXT_Y + i * BOARD_LINE_H;
    ctx.translate(x, y);
    ctx.rotate((Math.sin(i * 7.3) * 0.02));
    ctx.fillStyle = m.color;
    ctx.fillText(m.text, 0, 0);
    ctx.restore();
  });
  ctx.restore();
}

function drawNpc(ctx) {
  const cx = npc.x + npc.w/2, feetY = npc.y + npc.h;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(cx, feetY, 16, 5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#3a5fa0';
  ctx.fillRect(cx - 10, feetY - 46, 20, 34);
  ctx.fillStyle = '#e8b98a';
  ctx.beginPath();
  ctx.arc(cx, feetY - 54, 10, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#222';
  ctx.fillRect(cx-4, feetY-56, 2, 2);
  ctx.fillRect(cx+2, feetY-56, 2, 2);
  ctx.restore();

  ctx.save();
  ctx.font = '11px sans-serif';
  ctx.fillStyle = '#dfe8ff';
  ctx.textAlign = 'center';
  ctx.fillText('Guide', cx, feetY - 66);
  ctx.restore();
}

let portalT = 0;
function drawPortalSwirl(ctx, rect, hue) {
  portalT += 0.05;
  const cx = rect.x + rect.w/2, cy = rect.y + rect.h/2;
  const rx = rect.w/2, ry = rect.h/2;
  ctx.save();
  ctx.translate(cx, cy);

  const grad = ctx.createRadialGradient(0,0,2, 0,0, Math.max(rx,ry));
  grad.addColorStop(0, `hsla(${hue}, 100%, 85%, 0.95)`);
  grad.addColorStop(0.5, `hsla(${hue}, 100%, 60%, 0.55)`);
  grad.addColorStop(1, `hsla(${hue}, 100%, 40%, 0)`);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = `hsla(${hue}, 100%, 80%, 0.9)`;
  ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    ctx.save();
    ctx.rotate(portalT + i * (Math.PI*2/3));
    ctx.beginPath();
    ctx.ellipse(0, 0, rx*0.7, ry*0.7, 0, 0, Math.PI*1.3);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function drawLaptopGlow(ctx) {
  if (!nearLaptop) return;
  const cx = laptop.x + laptop.w/2, cy = laptop.y + laptop.h/2;
  const pulse = 0.6 + 0.4 * Math.sin(portalT * 1.6);
  ctx.save();
  ctx.strokeStyle = `rgba(120, 220, 255, ${pulse})`;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.ellipse(cx, cy + laptop.h/2, laptop.w/2 + 10, 14, 0, 0, Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

function drawHitboxes(ctx) {
  ctx.save();
  const hb = currentHitboxes();
  for (const box of hb) {
    if (box.type === 'chair') ctx.strokeStyle = 'rgba(255,80,80,0.9)';
    else if (box.type === 'desk') ctx.strokeStyle = 'rgba(255,200,60,0.9)';
    else if (box.type === 'wall' || box.type === 'board') ctx.strokeStyle = 'rgba(120,160,255,0.6)';
    else if (box.type === 'door') ctx.strokeStyle = 'rgba(255,140,0,0.9)';
    else if (box.type === 'npc') ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    else ctx.strokeStyle = 'rgba(180,120,255,0.9)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(box.x, box.y, box.w, box.h);
  }
  if (scene === 'classroom') {
    ctx.strokeStyle = 'rgba(255,220,0,0.9)';
    ctx.strokeRect(boardZone.x, boardZone.y, boardZone.w, boardZone.h);
    ctx.strokeStyle = 'rgba(0,220,255,0.9)';
    ctx.strokeRect(portal.x, portal.y, portal.w, portal.h);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.strokeRect(npcTalkZone.x, npcTalkZone.y, npcTalkZone.w, npcTalkZone.h);
  } else {
    ctx.strokeStyle = 'rgba(0,220,255,0.9)';
    ctx.strokeRect(backPortal.x, backPortal.y, backPortal.w, backPortal.h);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.strokeRect(laptopZone.x, laptopZone.y, laptopZone.w, laptopZone.h);
  }
  ctx.strokeStyle = 'rgba(60,255,120,0.95)';
  ctx.strokeRect(player.x, player.y, player.w, player.h);
  ctx.restore();
}

function drawScene() {
  updateCamera();
  drawBackground();

  resetTransform(fgCtx);
  fgCtx.clearRect(0, 0, W, H);
  applyCameraTransform(fgCtx);

  if (scene === 'classroom') {
    if (npcTalked) drawPortalSwirl(fgCtx, portal, 195);
    else drawNpc(fgCtx);
    drawBoardMessages(fgCtx);
  } else {
    drawPortalSwirl(fgCtx, backPortal, 210);
    drawLaptopGlow(fgCtx);
  }

  drawPlayer(fgCtx);
  if (scene === 'cyberland') {
    const feetY = player.y + player.h;
    for (const o of cyberlandOccluders) {
      if (feetY < o.anchorY) {
        fgCtx.drawImage(cyberImg, o.srcX, o.srcY, o.srcW, o.srcH, o.dstX, o.dstY, o.dstW, o.dstH);
      }
    }
  }
  if (showHit) drawHitboxes(fgCtx);

  const feetBox = { x: player.x, y: player.y, w: player.w, h: player.h };

  if (scene === 'classroom') {
    nearBoard = rectsOverlap(feetBox, boardZone);
    nearNpc = rectsOverlap(feetBox, npcTalkZone);

    if (!modalOpen) {
      boardPromptEl.style.display = nearBoard ? 'block' : 'none';
      writeBtn.style.display = nearBoard ? 'block' : 'none';
      actionPromptEl.style.display = (nearNpc && !nearBoard && !npcTalked) ? 'block' : 'none';
      talkBtn.style.display = (nearNpc && !nearBoard && !npcTalked) ? 'block' : 'none';
    } else {
      boardPromptEl.style.display = 'none';
      writeBtn.style.display = 'none';
      actionPromptEl.style.display = 'none';
      talkBtn.style.display = 'none';
    }

    if (teleportCooldown <= 0 && rectsOverlap(feetBox, portal)) {
      if (npcTalked) {
        teleportTo('cyberland', backPortal.x + backPortal.w/2 - player.w/2, backPortal.y - 30);
      } else if (speechTimer <= 0) {
        showSpeech("Talk to the guide first!", 1600);
      }
    }
  } else {
    boardPromptEl.style.display = 'none';
    writeBtn.style.display = 'none';
    actionPromptEl.style.display = 'none';
    talkBtn.style.display = 'none';

    nearLaptop = rectsOverlap(feetBox, laptopZone);
    if (!videoModalOpen) {
      laptopBtn.style.display = nearLaptop ? 'block' : 'none';
    } else {
      laptopBtn.style.display = 'none';
    }

    if (teleportCooldown <= 0 && rectsOverlap(feetBox, backPortal)) {
      teleportTo('classroom', portal.x - 27, portal.y + 61);
    }
  }

  if (teleportCooldown > 0) teleportCooldown--;
  if (speechTimer > 0) {
    speechTimer -= 16;
    if (speechTimer <= 0) speechBubbleEl.style.display = 'none';
  }

  document.getElementById('posLabel').textContent = `x: ${Math.round(player.x)}, y: ${Math.round(player.y)}`;
}

function loop() {
  if (gameState === 'menu') {
    drawMenu();
  } else if (gameState === 'fade') {
    drawFadeTransition();
  } else if (gameState === 'charselect') {
    drawCharSelect();
  } else {
    const held = heldDir();
    let dx = held.dx, dy = held.dy;
    for (const k in padState) { dx += padState[k].dx; dy += padState[k].dy; }
    dx = Math.max(-1, Math.min(1, dx));
    dy = Math.max(-1, Math.min(1, dy));
    tryMove(dx, dy);
    drawScene();
  }
  requestAnimationFrame(loop);
}

let gameLoopStarted = false;
function tryStart() {
  if (gameLoopStarted) return;
  if (charsLoaded >= NUM_CHAR_IMAGES && roomLoaded && cyberLoaded && startupLoaded && charSelectLoaded >= NUM_CHARSELECT_IMAGES) {
    gameLoopStarted = true;
    gameStartTime = Date.now();
    updateUIVisibility();
    loop();
  }
}
roomImg.onload = () => { roomLoaded = true; tryStart(); };
cyberImg.onload = () => { cyberLoaded = true; tryStart(); };
for (const key in charImgs) {
  charImgs[key].onload = () => { refreshContentBox(key); charsLoaded++; tryStart(); };
}
</script>
